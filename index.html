<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Viewer</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/webp" href="logo.webp">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="app-header">
    <div class="app-brand">
      <span class="logo-wrap"><img src="logo.webp" alt="VilPower" class="app-logo"></span>
      <span class="divider"></span>
      <span class="app-title">Style Viewer</span>
    </div>
    <div class="header-right">
      <span class="app-count" id="imageCount">0 images</span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
        <svg class="ico-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="ico-moon" viewBox="0 0 24 24">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </div>
  </header>

  <main class="split">
    <section class="panel-left">
      <div class="grid-toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input id="search" type="text" placeholder="Search styles…" autocomplete="off">
        </div>
        <div class="seg" id="seg">
          <span class="seg-pill"></span>
          <button class="col-btn" data-cols="1">1</button>
          <button class="col-btn active" data-cols="2">2</button>
          <button class="col-btn" data-cols="3">3</button>
        </div>
      </div>
      <div class="card-grid cols-2" id="cardGrid"></div>
      <p class="empty" id="empty" hidden>No matches</p>
    </section>

    <section class="panel-right">
      <div class="code-header">
        <span class="code-filename"><span class="dot"></span><span id="codeFilename">Select an image</span></span>
        <button class="copy-btn" id="copyBtn" type="button" disabled>
          <svg class="ico-copy" viewBox="0 0 24 24">
            <rect x="9" y="9" width="12" height="12" rx="2" />
            <path d="M5 15V5a2 2 0 0 1 2-2h10" />
          </svg>
          <svg class="ico-check" viewBox="0 0 24 24">
            <path d="M5 12l5 5L20 7" />
          </svg>
          <span id="copyLabel">Copy</span>
        </button>
      </div>
      <div class="code-body">
        <p class="placeholder" id="placeholder">Select an image text</p>
        <pre class="code-block" id="codeBlock" hidden><code id="codeContent"></code></pre>
      </div>
      </secttion>
  </main>
  <script src="script.js"></script>
</body>

</html>
